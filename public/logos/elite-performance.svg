<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 340" width="100%" height="100%" fill="none">
  <!-- Horizontal Crease Lines behind -->
  <line x1="75" y1="95" x2="305" y2="95" stroke="#0e2254" stroke-width="2.5" />
  <line x1="75" y1="116" x2="305" y2="116" stroke="#0e2254" stroke-width="2.5" />

  <!-- Cricket Bats (Crossed) -->
  <!-- Left-leaning Bat (handle at top right, blade at bottom left) -->
  <g transform="translate(190, 115) rotate(42) translate(-190, -115)">
    <!-- Handle -->
    <rect x="184" y="10" width="12" height="60" rx="3" fill="#ffffff" stroke="#0e2254" stroke-width="2.5" />
    <line x1="184" y1="22" x2="196" y2="22" stroke="#0e2254" stroke-width="1.5" />
    <line x1="184" y1="34" x2="196" y2="34" stroke="#0e2254" stroke-width="1.5" />
    <line x1="184" y1="46" x2="196" y2="46" stroke="#0e2254" stroke-width="1.5" />
    <line x1="184" y1="58" x2="196" y2="58" stroke="#0e2254" stroke-width="1.5" />
    <!-- Blade -->
    <path d="M 175 70 L 205 70 L 207 195 C 207 205 173 205 173 195 Z" fill="#ffffff" stroke="#0e2254" stroke-width="2.5" />
    <!-- Wood grain curves -->
    <path d="M 179 90 C 185 130 185 160 177 190" stroke="#0e2254" stroke-width="1.5" />
    <path d="M 201 90 C 195 130 195 160 203 190" stroke="#0e2254" stroke-width="1.5" />
  </g>

  <!-- Right-leaning Bat (handle at top left, blade at bottom right) -->
  <g transform="translate(190, 115) rotate(-42) translate(-190, -115)">
    <!-- Handle -->
    <rect x="184" y="10" width="12" height="60" rx="3" fill="#ffffff" stroke="#0e2254" stroke-width="2.5" />
    <line x1="184" y1="22" x2="196" y2="22" stroke="#0e2254" stroke-width="1.5" />
    <line x1="184" y1="34" x2="196" y2="34" stroke="#0e2254" stroke-width="1.5" />
    <line x1="184" y1="46" x2="196" y2="46" stroke="#0e2254" stroke-width="1.5" />
    <line x1="184" y1="58" x2="196" y2="58" stroke="#0e2254" stroke-width="1.5" />
    <!-- Blade -->
    <path d="M 175 70 L 205 70 L 207 195 C 207 205 173 205 173 195 Z" fill="#ffffff" stroke="#0e2254" stroke-width="2.5" />
    <!-- Wood grain curves -->
    <path d="M 179 90 C 185 130 185 160 177 190" stroke="#0e2254" stroke-width="1.5" />
    <path d="M 201 90 C 195 130 195 160 203 190" stroke="#0e2254" stroke-width="1.5" />
  </g>

  <!-- Cricket Ball with Speed Trail -->
  <g>
    <!-- Speed Trail Swoosh -->
    <path d="M 175 160 C 170 110, 215 90, 210 40 C 220 70, 192 110, 195 160 Z" fill="#0e2254" />
    <path d="M 183 150 C 180 115, 205 98, 202 50 C 208 75, 192 115, 194 150 Z" fill="#ffffff" />
    <!-- Cricket Ball -->
    <circle cx="190" cy="165" r="28" fill="#ffffff" stroke="#0e2254" stroke-width="3" />
    <!-- Ball Seam -->
    <line x1="162" y1="165" x2="218" y2="165" stroke="#0e2254" stroke-width="2" />
    <line x1="166" y1="162" x2="170" y2="168" stroke="#0e2254" stroke-width="1.5" />
    <line x1="176" y1="162" x2="180" y2="168" stroke="#0e2254" stroke-width="1.5" />
    <line x1="186" y1="162" x2="190" y2="168" stroke="#0e2254" stroke-width="1.5" />
    <line x1="196" y1="162" x2="200" y2="168" stroke="#0e2254" stroke-width="1.5" />
    <line x1="206" y1="162" x2="210" y2="168" stroke="#0e2254" stroke-width="1.5" />
  </g>

  <!-- Typography -->
  <text x="190" y="250" text-anchor="middle" fill="#0e2254" font-family="'Outfit', system-ui, sans-serif" font-weight="900" font-size="44" letter-spacing="0.08em">
    ELITE
  </text>
  <text x="190" y="285" text-anchor="middle" fill="#0e2254" font-family="'Outfit', system-ui, sans-serif" font-weight="700" font-size="18" letter-spacing="0.48em">
    PERFORMANCE
  </text>
</svg>
